# Main HTTP server. Defaults to 8082 because 8080 is taken by the demo GitLab
# container (docker-compose). Override with SERVER_PORT if you need another port.
server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ai-code-reviewer

  # ── Database ──────────────────────────────────────────────────────────────
  datasource:
    url:      jdbc:postgresql://${DB_HOST:localhost}:5432/ai_reviewer
    username: ${DB_USER:reviewer}
    password: ${DB_PASS:reviewer}

  jpa:
    hibernate:
      ddl-auto: update          # use Flyway/Liquibase in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Spring AI — provider selection ────────────────────────────────────────
  # AI_PROVIDER picks the active chat model (anthropic | openai). Both starters are
  # on the classpath; spring.ai.model.chat disables the inactive one so exactly one
  # ChatModel bean is created. This is the "swap provider in config" story (ADR-001).
  ai:
    model:
      chat: ${AI_PROVIDER:anthropic}

    # Anthropic (Claude) — native integration. Default demo provider.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:placeholder}
      chat:
        model: ${AI_MODEL:claude-haiku-4-5}
        options:
          temperature: 0.1

    # OpenAI-compatible: OpenAI, OpenRouter, or a local Ollama endpoint.
    #   OpenAI      → https://api.openai.com      (model e.g. gpt-4o-mini)
    #   OpenRouter  → https://openrouter.ai/api   (model e.g. google/gemini-2.0-flash-001)
    #   Ollama      → http://localhost:11434      (model e.g. qwen2.5-coder, key any non-empty value)
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key:  ${OPENAI_API_KEY:placeholder}
      chat:
        options:
          model:       ${AI_MODEL:gpt-4o-mini}
          temperature: 0.1

# ── GitLab ───────────────────────────────────────────────────────────────────
gitlab:
  url:            ${GITLAB_URL:https://gitlab.example.com}
  token:          ${GITLAB_TOKEN:placeholder}
  webhook-secret: ${GITLAB_WEBHOOK_SECRET:placeholder}

# ── Reviewer tuning ───────────────────────────────────────────────────────────
reviewer:
  min-severity:           ${MIN_SEVERITY:Low}
  max-files-per-review:   30
  request-timeout-seconds: 120
  retry-max-attempts:     3
  retry-backoff-seconds:  2
  # Let the LLM pull repo context on demand (full files, symbol lookups) at the exact
  # reviewed SHA — no pre-indexing. Disabled by default (diff-only baseline).
  context-tools:
    enabled:        ${CONTEXT_TOOLS_ENABLED:false}
    call-budget:    ${CONTEXT_TOOLS_BUDGET:6}
    max-file-lines: ${CONTEXT_TOOLS_MAX_LINES:400}
  ignore-extensions:
    - .lock
    - go.sum
    - go.mod
    - .pb.go
    - swagger.yaml
    - .svg
    - .png
    - .md

# ── Actuator / Observability ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
